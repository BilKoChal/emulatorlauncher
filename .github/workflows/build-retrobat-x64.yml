name: Build emulatorlauncher (Windows x64)
 
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: windows-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # .NET Framework 4.0 is already available on windows-latest runners,
      # but we install the build tools to ensure MSBuild / NuGet are on PATH.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
 
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
 
      - name: Restore NuGet packages
        run: nuget restore batocera-ports.sln
 
      - name: Patch AssemblyInfo version
        shell: pwsh
        run: |
          $version = "1.0.0.${{ github.run_number }}"
          Get-ChildItem -Recurse -Filter "AssemblyInfo.*" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace 'AssemblyVersion\("[^"]*"\)',      "AssemblyVersion(`"$version`")"
            $content = $content -replace 'AssemblyFileVersion\("[^"]*"\)',  "AssemblyFileVersion(`"$version`")"
            $content = $content -replace 'AssemblyInformationalVersion\("[^"]*"\)', "AssemblyInformationalVersion(`"$version`")"
            Set-Content $_.FullName $content
          }
          Write-Host "Version set to $version"
 
      - name: Build solution (Release / Any CPU)
        run: >
          msbuild batocera-ports.sln
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:PlatformTarget=x64
          /m
          /v:minimal
 
      - name: Collect build artifacts
        shell: pwsh
        run: |
          # Copy compiled binaries to staging directory
          New-Item -ItemType Directory -Force -Path staging | Out-Null
 
          $bins = @(
            "emulatorLauncher\bin\Release\emulatorLauncher.exe",
            "EmulatorLauncher.Common\bin\Release\EmulatorLauncher.Common.dll",
            "batocera-retroachievements-info\bin\Release\batocera-retroachievements-info.exe",
            "batocera-systems\bin\Release\batocera-systems.exe",
            "batocera-store\bin\Release\batocera-store.exe",
            "mount\bin\Release\mount.exe"
          )
 
          # Rename test binaries as the original CI does
          $renames = @{
            "es-checkversion\bin\Release\es-checkversion.exe" = "staging\es-checkversion-test.exe"
            "es-update\bin\Release\es-update.exe"             = "staging\es-update-test.exe"
          }
 
          foreach ($bin in $bins) {
            if (Test-Path $bin) {
              Copy-Item $bin staging\ -Force
              Write-Host "Copied $bin"
            } else {
              Write-Warning "Not found: $bin"
            }
          }
 
          foreach ($src in $renames.Keys) {
            if (Test-Path $src) {
              Copy-Item $src $renames[$src] -Force
              Write-Host "Copied $src -> $($renames[$src])"
            } else {
              Write-Warning "Not found: $src"
            }
          }
 
          # Copy bundled libs from the repo's libs/ directory
          $libs = @(
            "libs\7z.exe", "libs\7z.dll",
            "libs\7za.exe", "libs\7za.dll", "libs\7zxa.dll",
            "libs\Newtonsoft.Json.dll",
            "libs\System.Data.SQLite.dll",
            "libs\unzip.exe", "libs\unzip32.dll",
            "libs\pdftoppm.exe", "libs\pdfinfo.exe",
            "libs\rdsquashfs.exe", "libs\xbox-iso-vfs.exe",
            "libs\liblzma.dll", "libs\liblzo2-2.dll",
            "libs\libsquashfs.dll", "libs\libzstd.dll"
          )
 
          foreach ($lib in $libs) {
            if (Test-Path $lib) {
              Copy-Item $lib staging\ -Force
              Write-Host "Copied $lib"
            } else {
              Write-Warning "Not found: $lib"
            }
          }
 
          # Copy EmulationStation config
          if (Test-Path ".emulationstation\es_features.cfg") {
            New-Item -ItemType Directory -Force -Path "staging\.emulationstation" | Out-Null
            Copy-Item ".emulationstation\es_features.cfg" "staging\.emulationstation\" -Force
            Write-Host "Copied es_features.cfg"
          }
 
      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path staging\* -DestinationPath batocera-ports-x64.zip -Force
          Write-Host "Archive created: batocera-ports-x64.zip"
 
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: batocera-ports-x64-${{ github.run_number }}
          path: batocera-ports-x64.zip
          retention-days: 30
 
      # -----------------------------------------------------------------------
      # Optional: publish as a GitHub Release on every push to master.
      # Remove or comment out this step if you don't want automatic releases.
      # -----------------------------------------------------------------------
      - name: Create / update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: continuous
          files: batocera-ports-x64.zip
          prerelease: true
          body: |
            Automated build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
